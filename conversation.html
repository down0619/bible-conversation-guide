{category:'general',id:'worry',icon:'☁',question:'걱정이 많을 때 도움이 되는 말씀이 있을까요?',tag:'염려와 마음의 평화',title:'걱정이 많을 때 도움이 되는 말씀이 있을까요?',intro:'일과 생활, 앞날에 대한 걱정은 마음을 무겁게 할 수 있습니다. 성경에는 기도와 마음의 평화에 관한 격려가 있습니다.',verse:'“아무것도 염려하지 말고, 모든 일에 … 여러분의 청원을 하느님께 알리십시오.”',ref:'빌립보서 4:6, 7',verseZh:'什么事都不要忧虑。不管是什么事，都要通过祷告和恳切祈求，连同感谢，把你们的请求告诉上帝。这样，上帝就会赐下超越人能理解的安宁。通过基督耶稣，这种安宁会守护你们的内心和头脑。',thought:'이 구절은 걱정을 혼자 감당하지 말고 하느님께 말씀드릴 수 있다고 격려합니다.',image:'2015722_univ_lsr_md.jpg',imageFit:'contain',alt:'해질 무렵 기도하는 사람',pub:'빌립보서 4:6, 7—“아무것도 걱정하지 마십시오”',pubUrl:'https://www.jw.org/ko/성경-가르침/성경-구절/빌립보서-4-6-7/',verseUrl:'https://www.jw.org/ko/성경-가르침/성경-구절/빌립보서-4-6-7/',videoUrl:'https://www.jw.org/ko/%EB%9D%BC%EC%9D%B4%EB%B8%8C%EB%9F%AC%EB%A6%AC/%EB%8F%99%EC%98%81%EC%83%81/%ED%95%98%EB%8A%90%EB%8B%98%EC%97%90%EA%B2%8C%EC%84%9C-%EC%98%A8-%EC%A2%8B%EC%9D%80-%EC%86%8C%EC%8B%9D-%EB%8F%99%EC%98%81%EC%83%81-%EC%8B%9C%EB%A6%AC%EC%A6%88/%EB%8F%99%EC%98%81%EC%83%81-%ED%95%98%EB%8A%90%EB%8B%98%EC%9D%80-%EA%B8%B0%EB%8F%84%EB%A5%BC-%EB%93%A4%EC%9C%BC%EC%8B%AD%EB%8B%88%EA%B9%8C/',videoFile:'https://cfp2.jw-cdn.org/a/a1a391b/1/o/502018856_KO_cnt_1_r360P.mp4'},
{category:'general',id:'future',icon:'↗',question:'앞으로 더 나은 미래가 올까요?',tag:'희망과 미래',title:'더 나은 미래에 대한 희망이 있을까요?',intro:'미래에 대해 생각하면 걱정이 앞설 때가 있습니다. 성경은 평화롭고 안전한 미래에 대한 구체적인 희망을 전합니다.',verse:'전에 기록된 모든 것은 우리에게 교훈을 주기 위해 기록되었습니다. 그래서 우리는 인내와 성경의 위로를 통해 희망을 가질 수 있습니다.',ref:'로마서 15:4',verseZh:'从前写下来的话，全是为教导我们而写的，让我们借着忍耐，借着圣经给人的安慰，可以怀有希望。',thought:'성경에 기록된 말씀은 인내와 위로를 주어 희망을 갖게 합니다.',image:'future-hope.jpg',imageFit:'contain',alt:'푸른 들판을 바라보며 앉아 있는 가족',pub:'전도지 | 우리의 미래는 어떻게 될까요?',pubUrl:'https://www.jw.org/ko/라이브러리/전도지/미래-전도지/',verseUrl:'https://wol.jw.org/ko/wol/b/r8/lp-ko/nwtsty/45/15',videoUrl:'https://www.jw.org/ko/%EB%9D%BC%EC%9D%B4%EB%B8%8C%EB%9F%AC%EB%A6%AC/%EB%8F%99%EC%98%81%EC%83%81/#ko/mediaitems/VODMinistryTools/pub-imv_3_VIDEO',videoFile:'https://cfp2.jw-cdn.org/a/392bf6/1/o/imv_KO_03_r360P.mp4',videoPoster:'https://cms-imgp.jw-cdn.org/img/p/1102012770/univ/art/1102012770_univ_sqr_xl.jpg'}

function xmlEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function wrapVerse(text,max){const chars=Array.from(text);const lines=[];while(chars.length){let cut=Math.min(max,chars.length);if(cut<chars.length){const space=chars.lastIndexOf(' ',cut);if(space>Math.floor(max*.55))cut=space}let line=chars.splice(0,cut).join('').trim();while(chars[0]===' ')chars.shift();lines.push(line)}return lines}function verseImageSrc(t){const ko=wrapVerse(t.verse,21),zh=wrapVerse(t.verseZh,21),h=160+ko.length*52+zh.length*52+140,koY=190,dividerY=koY+ko.length*52+21,zhLabelY=dividerY+42,zhY=zhLabelY+42;const spans=(lines,y)=>lines.map((line,i)=>`<tspan x="78" y="${y+i*52}">${xmlEscape(line)}</tspan>`).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 ${h}" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4e9"/><stop offset="1" stop-color="#e6f0ea"/></linearGradient><linearGradient id="accent"><stop stop-color="#a57b39"/><stop offset="1" stop-color="#2d6b69"/></linearGradient></defs><rect width="900" height="${h}" rx="28" fill="url(#bg)"/><circle cx="830" cy="40" r="110" fill="#fff" opacity=".42"/><path d="M0 0h900v10H0z" fill="url(#accent)"/><text x="78" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" letter-spacing="3" fill="#52706a">성경 말씀 · 经文</text><text x="78" y="125" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="29" font-weight="700" fill="#18333a">${xmlEscape(t.ref)}</text><text font-family="'Malgun Gothic','Microsoft YaHei',sans-serif" font-size="32" fill="#20383a">${spans(ko,koY)}</text><path d="M78 ${dividerY}h744" stroke="#c8d6ce" stroke-width="2"/><text x="78" y="${zhLabelY}" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" letter-spacing="2" fill="#52706a">中文 · 简体</text><text font-family="'Microsoft YaHei','SimHei',sans-serif" font-size="32" fill="#20383a">${spans(zh,zhY)}</text><text x="822" y="${h-29}" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#80918a">JW.ORG</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}

const noteField=document.getElementById('videoNote-'+t.id);if(noteField){const storageKey='bibleConversationNote:'+t.id;const status=document.getElementById('videoNoteStatus-'+t.id);const clearButton=document.getElementById('videoNoteClear-'+t.id);try{noteField.value=localStorage.getItem(storageKey)||''}catch(e){status.textContent='저장 기능을 사용할 수 없습니다'}let saveTimer;noteField.addEventListener('input',()=>{status.textContent='저장 중…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(storageKey,noteField.value);status.textContent='저장됨'}catch(e){status.textContent='저장하지 못했습니다'}} ,250)});clearButton.addEventListener('click',()=>{if(!noteField.value)return;noteField.value='';try{localStorage.removeItem(storageKey);status.textContent='메모 삭제됨'}catch(e){status.textContent='삭제하지 못했습니다'}noteField.focus()})}const modal=document.getElementById('verseModal'),modalImg=document.getElementById('modalVerseImage'),openImage=(src,alt)=>{modalImg.src=src;modalImg.alt=alt;modal.showModal()};
